version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    allow:
      # Scheduled version updates exclude majors. Security updates are not
      # filtered by allow.update-types and remain eligible at every severity.
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    ignore:
      # 6.10.0 was deprecated by its publisher because it introduced breaking
      # changes in a minor release. Revisit only after a deliberate 7.x review.
      - dependency-name: "@testing-library/jest-dom"
        versions:
          - "6.10.0"
    groups:
      npm-monthly-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: /apps/backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    ignore:
      # Ruff 0.16 changes repository-wide lint behavior. Keep the validated
      # 0.15 line until that migration is reviewed as its own platform PR.
      - dependency-name: ruff
        versions:
          - ">=0.16.0,<0.17.0"
    groups:
      python-monthly-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      actions-monthly-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
