name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject secrets and private material
        run: python scripts/security/scan_secrets.py
      - name: Verify provider egress Gate fails closed
        run: python scripts/security/test_provider_egress_gate.py
      - name: Verify Keycloak identity contract
        run: python scripts/security/test_keycloak_contract.py
      - name: Reject legacy Sites and Cloudflare runtime
        run: python scripts/verify_no_legacy.py
      - name: Verify immutable container image locks
        run: python scripts/verify_image_locks.py

  web:
    name: Web lint, test, and build
    runs-on: ubuntu-latest
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm run build
      - name: Playwright Chromium and accessibility smoke
        run: npm run test:e2e:ci --workspace @biaice/web
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - name: Generated TypeScript client compiles
        run: npx --no-install tsc --noEmit --strict --lib ES2022,DOM packages/contracts/generated-typescript/index.ts

  backend:
    name: Backend tests and contract drift
    runs-on: ubuntu-latest
    env:
      BIAICE_DEPLOYMENT_PROFILE: synthetic_http
      BIAICE_REAL_DATA_MODE_REQUESTED: "false"
      BIAICE_BYOK_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.lock
      - run: python -m pip install --require-hashes --requirement apps/backend/requirements-test.lock
      - run: >-
          python -m ruff check apps/backend packages/contracts/scripts
          scripts/contracts scripts/security scripts/validate_compose_topology.py
          scripts/verify_image_locks.py scripts/verify_no_legacy.py
      - run: python -m pytest apps/backend/tests
      - run: python packages/contracts/scripts/generate_contracts.py --check
      - run: python scripts/contracts/check_contract_status.py
      - name: Fetch pull request OpenAPI baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - name: Reject breaking OpenAPI changes or establish the reviewed M0 baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
        run: |
          if git cat-file -e "origin/${BASE_REF}:packages/contracts/openapi.generated.json"; then
            python scripts/contracts/check_breaking_changes.py "origin/${BASE_REF}"
          elif [ "${HEAD_REF}" = "feature/m1-platform-foundation" ] && [ "${ACTOR}" = "studynightfive" ]; then
            python scripts/contracts/check_breaking_changes.py "origin/${BASE_REF}" --allow-missing-baseline
          else
            echo "OpenAPI baseline is missing and this is not the authorized M0 bootstrap PR." >&2
            exit 2
          fi
      - name: Reject breaking OpenAPI changes on main
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          ZERO_SHA=0000000000000000000000000000000000000000
          if [ "${BASE_SHA}" = "${ZERO_SHA}" ]; then
            python scripts/contracts/check_breaking_changes.py \
              "${BASE_SHA}" --allow-missing-baseline
          elif git cat-file -e "${BASE_SHA}:packages/contracts/openapi.generated.json"; then
            python scripts/contracts/check_breaking_changes.py "${BASE_SHA}"
          elif git cat-file -e "HEAD:packages/contracts/openapi.generated.json"; then
            echo "Establishing the first reviewed OpenAPI baseline on main."
            python scripts/contracts/check_breaking_changes.py \
              "${BASE_SHA}" --allow-missing-baseline
          else
            echo "The current main commit is missing the OpenAPI baseline." >&2
            exit 2
          fi
      - name: Audit locked production Python dependencies
        run: python -m pip_audit --requirement apps/backend/requirements.lock --require-hashes --disable-pip --strict
      - name: Generated contract must be current
        run: git diff --exit-code -- packages/contracts

  compose:
    name: Compose topology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.example config --quiet
      - name: Only gateway may publish LAN ports
        run: python scripts/validate_compose_topology.py
