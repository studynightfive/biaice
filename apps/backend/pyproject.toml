[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "biaice-backend"
version = "0.1.0"
description = "Biaice self-hosted API and governance workers"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.19.1",
  "celery[redis]==5.6.3",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "PyJWT[crypto]==2.13.0",
  "SQLAlchemy==2.0.51",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==6.3.0",
  "ruff==0.15.22",
  "schemathesis==4.24.3",
  "uv==0.12.5",
]

[project.scripts]
biaice = "biaice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biaice"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["biaice"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
