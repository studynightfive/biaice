global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: biaice-local

scrape_configs:
  - job_name: biaice-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
